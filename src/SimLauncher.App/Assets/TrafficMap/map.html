<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Traffic Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #909090; font: 14px 'Segoe UI', sans-serif; background: #1e1e1e; z-index: 10;
  }
  .mapboxgl-popup-content {
    background: #252526; color: #e8e8e8; font: 12px 'Segoe UI', sans-serif;
    border: 1px solid #3f3f46; border-radius: 6px; padding: 10px 12px;
  }
  .mapboxgl-popup-tip { border-top-color: #252526 !important; border-bottom-color: #252526 !important; }
  .mapboxgl-popup-close-button { color: #909090; }
  .cs { font-weight: 600; font-size: 14px; color: #4fc3f7; }
  .detail { color: #b8b8b8; margin-top: 4px; line-height: 1.5; }
  .removeBtn {
    margin-top: 8px; width: 100%; background: #4a2626; color: #f0b0b0; border: 1px solid #a05050;
    border-radius: 4px; padding: 4px 8px; cursor: pointer; font: 12px 'Segoe UI', sans-serif;
  }
  .removeBtn:hover { background: #5a2f2f; }
</style>
</head>
<body>
<div id="map"></div>
<div id="overlay">Waiting for launcher…</div>
<script>
'use strict';

const host = window.chrome && window.chrome.webview ? window.chrome.webview : null;
function toHost(msg) { if (host) { host.postMessage(msg); } }

// ---- aircraft state: callsign -> { fix, fixAt, disp, trail, props } -------------------
const aircraft = new Map();
let conflicts = [];          // [{a, b, severity}]
let map = null;
let mapLoaded = false;
let trailsOn = false;
let labelsOn = false;

// Declutter: ground traffic (parked/taxiing) only renders when zoomed in this far.
// Airborne aircraft and the player are always drawn at every zoom.
const GROUND_HIDE_BELOW_ZOOM = 8;
let didInitialCenter = false;
let pendingSnapshot = null;

const COLORS = {
  player:   '#4fc3f7',
  // Red/yellow are reserved for conflicts involving the player; AI-vs-AI pairs are blue.
  'conflict-player': '#ff5252',
  'caution-player':  '#e5c07b',
  'conflict-ai':     '#5c9dff',
  'caution-ai':      '#49739e',
  ground:   '#8a8a8a',
  approach: '#f0a050',
  depart:   '#64b5f6',
  cruise:   '#7bc97f',
  other:    '#b0bec5',
};

function colorKey(ac) {
  if (ac.sev && COLORS[ac.sev]) { return ac.sev; }
  if (ac.isPlayer) { return 'player'; }
  if (ac.onGround) { return 'ground'; }
  const s = (ac.state || '').toLowerCase();
  if (/approach|final|land/.test(s)) { return 'approach'; }
  if (/taxi|ground|gate|park|pushback|hold/.test(s)) { return 'ground'; }
  if (/depart|climb|takeoff/.test(s)) { return 'depart'; }
  if (/cruise|enroute|descen/.test(s)) { return 'cruise'; }
  return 'other';
}

// ---- icon: simple airliner silhouette pointing north, one tinted copy per color ------
function makeIcon(color) {
  const size = 48;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.translate(size / 2, size / 2);
  ctx.scale(size / 48, size / 48);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -19);            // nose
  ctx.bezierCurveTo(2.5, -16, 2.5, -12, 2.5, -8);
  ctx.lineTo(20, 2); ctx.lineTo(20, 6); ctx.lineTo(2.5, 1);   // right wing
  ctx.lineTo(2.5, 12);
  ctx.lineTo(8, 17); ctx.lineTo(8, 20); ctx.lineTo(0, 17.5);  // right tail
  ctx.lineTo(-8, 20); ctx.lineTo(-8, 17); ctx.lineTo(-2.5, 12); // left tail
  ctx.lineTo(-2.5, 1); ctx.lineTo(-20, 6); ctx.lineTo(-20, 2); ctx.lineTo(-2.5, -8); // left wing
  ctx.bezierCurveTo(-2.5, -12, -2.5, -16, 0, -19);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  return ctx.getImageData(0, 0, size, size);
}

// ---- label pill: 9-patch rounded rect stretched around the text via icon-text-fit ----
function makePill(fill, stroke) {
  const w = 26, h = 26, r = 7;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.beginPath();
  ctx.roundRect(1.5, 1.5, w - 3, h - 3, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  return [ctx.getImageData(0, 0, w, h), {
    stretchX: [[r + 2, w - r - 2]],
    stretchY: [[r + 2, h - r - 2]],
    content: [r, 5, w - r, h - 5],
  }];
}

const PILLS = {
  'pill-neutral':         ['rgba(24,24,26,0.82)',  '#3f3f46'],
  'pill-conflict-player': ['rgba(170,38,38,0.92)', '#ff6b6b'],
  'pill-caution-player':  ['rgba(229,192,123,0.95)', '#8a8a4a'],
  'pill-conflict-ai':     ['rgba(38,80,158,0.92)', '#5c9dff'],
  'pill-caution-ai':      ['rgba(43,62,92,0.90)',  '#49739e'],
};

function addIcons() {
  for (const key of Object.keys(COLORS)) {
    map.addImage('ac-' + key, makeIcon(COLORS[key]));
  }
  for (const key of Object.keys(PILLS)) {
    const [img, options] = makePill(PILLS[key][0], PILLS[key][1]);
    map.addImage(key, img, options);
  }
}

// ---- dead reckoning ------------------------------------------------------------------
function project(fix, elapsedMs) {
  const distNm = (fix.groundspeed || 0) * (elapsedMs / 3600000);
  if (distNm <= 0) { return { lat: fix.lat, lon: fix.lon }; }
  const hdg = fix.heading * Math.PI / 180;
  const dLat = (distNm / 60) * Math.cos(hdg);
  const cosLat = Math.cos(fix.lat * Math.PI / 180) || 1e-6;
  const dLon = (distNm / 60) * Math.sin(hdg) / cosLat;
  return { lat: fix.lat + dLat, lon: fix.lon + dLon };
}

function lerpHeading(from, to, k) {
  let d = ((to - from + 540) % 360) - 180;
  return (from + d * k + 360) % 360;
}

// ---- snapshot handling ----------------------------------------------------------------
function applySnapshot(snap) {
  const now = performance.now();
  const seen = new Set();

  for (const ac of snap.aircraft) {
    seen.add(ac.callsign);
    let entry = aircraft.get(ac.callsign);
    if (!entry) {
      entry = { disp: { lat: ac.lat, lon: ac.lon, heading: ac.heading }, trail: [] };
      aircraft.set(ac.callsign, entry);
    }
    entry.fix = ac;
    entry.fixAt = now;
    entry.props = ac;
    entry.trail.push([ac.lon, ac.lat]);
    if (entry.trail.length > 30) { entry.trail.shift(); }
  }
  for (const cs of [...aircraft.keys()]) {
    if (!seen.has(cs)) { aircraft.delete(cs); }
  }
  conflicts = snap.conflicts || [];

  if (!didInitialCenter && mapLoaded) {
    const player = snap.aircraft.find(a => a.isPlayer);
    if (player) {
      map.jumpTo({ center: [player.lon, player.lat], zoom: 9 });
      didInitialCenter = true;
    }
  }
}

// ---- render loop (throttled to ~30 fps) -----------------------------------------------
let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!mapLoaded || now - lastFrame < 33 || document.hidden) { return; }
  const dt = Math.min((now - lastFrame) / 1000, 0.5);
  lastFrame = now;
  const k = 1 - Math.exp(-dt * 3);   // exponential chase toward the projected position

  const points = [];
  const trailFeatures = [];
  const zoom = map.getZoom();
  for (const [cs, e] of aircraft) {
    if (e.props.onGround && !e.props.isPlayer && zoom < GROUND_HIDE_BELOW_ZOOM) {
      // Not rendered this frame: pin the display position to the fix so the marker
      // doesn't visibly chase a stale position when zooming back in.
      e.disp.lat = e.fix.lat;
      e.disp.lon = e.fix.lon;
      e.disp.heading = e.fix.heading;
      continue;
    }
    const target = e.fix.onGround && e.fix.groundspeed < 30
      ? { lat: e.fix.lat, lon: e.fix.lon }
      : project(e.fix, now - e.fixAt);
    e.disp.lat += (target.lat - e.disp.lat) * k;
    e.disp.lon += (target.lon - e.disp.lon) * k;
    e.disp.heading = lerpHeading(e.disp.heading, e.fix.heading, k);

    const label = labelsOn
      ? cs + '\n' + Math.round(e.props.alt) + ' ft · ' + Math.round(e.props.groundspeed) + ' kt'
      : cs;
    points.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [e.disp.lon, e.disp.lat] },
      properties: {
        callsign: cs,
        label: label,
        sev: e.props.sev || '',
        pill: e.props.sev ? 'pill-' + e.props.sev : 'pill-neutral',
        // Collision priority: conflict labels first, then the player, then the rest.
        priority: e.props.sev ? 0 : (e.props.isPlayer ? 1 : 2),
        ckey: colorKey(e.props),
        heading: e.disp.heading,
        size: e.props.isPlayer ? 1.15 : 0.72,
        dim: !!e.props.onGround && !e.props.isPlayer,
      },
    });
    if (trailsOn && e.trail.length > 1 && !e.props.onGround) {
      trailFeatures.push({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: e.trail },
        properties: { ckey: colorKey(e.props) },
      });
    }
  }

  const lines = [];
  for (const c of conflicts) {
    const a = aircraft.get(c.a);
    const b = aircraft.get(c.b);
    if (!a || !b) { continue; }
    lines.push({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: [[a.disp.lon, a.disp.lat], [b.disp.lon, b.disp.lat]] },
      properties: { severity: c.severity, player: !!c.player },
    });
  }

  map.getSource('aircraft').setData({ type: 'FeatureCollection', features: points });
  map.getSource('conflicts').setData({ type: 'FeatureCollection', features: lines });
  map.getSource('trails').setData({ type: 'FeatureCollection', features: trailsOn ? trailFeatures : [] });
}

// ---- popup -----------------------------------------------------------------------------
let popup = null;
function showPopup(feature) {
  const e = aircraft.get(feature.properties.callsign);
  if (!e) { return; }
  const p = e.props;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const route = (p.icaoFrom || p.icaoTo) ? `${esc(p.icaoFrom)} → ${esc(p.icaoTo)}` : '—';
  let html = `<div class="cs">${esc(p.callsign)}${p.isPlayer ? ' (you)' : ''}</div>
    <div class="detail">${esc(p.type)} · ${Math.round(p.alt)} ft · ${Math.round(p.groundspeed)} kt<br>
    ${route}<br>${esc(p.state)}${p.arrRunway ? ' · rwy ' + esc(p.arrRunway) : ''}</div>`;
  if (!p.isPlayer) {
    html += `<button class="removeBtn" id="removeBtn">Remove ${esc(p.callsign)}…</button>`;
  }
  if (popup) { popup.remove(); }
  popup = new mapboxgl.Popup({ offset: 14 })
    .setLngLat([e.disp.lon, e.disp.lat])
    .setHTML(html)
    .addTo(map);
  const btn = document.getElementById('removeBtn');
  if (btn) {
    btn.addEventListener('click', () => {
      toHost({ type: 'removeRequest', callsign: p.callsign });
      popup.remove();
    });
  }
}

// ---- map bootstrap ---------------------------------------------------------------------
function initMap(token) {
  if (map) { return; }
  if (!token) {
    document.getElementById('overlay').textContent =
      'Mapbox token missing — set traffic.mapboxToken in the launcher config.';
    return;
  }
  mapboxgl.accessToken = token;
  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [0, 45],
    zoom: 3,
    attributionControl: true,
    // Symbols re-place on every data tick; the default 300ms fade makes labels
    // visibly blink whenever conflict colours change. Update instantly instead.
    fadeDuration: 0,
  });
  map.on('load', () => {
    addIcons();
    map.addSource('trails', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addSource('conflicts', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addSource('aircraft', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

    map.addLayer({
      id: 'trails', type: 'line', source: 'trails',
      paint: { 'line-color': '#4fc3f7', 'line-width': 1, 'line-opacity': 0.35 },
    });
    map.addLayer({
      id: 'conflicts', type: 'line', source: 'conflicts',
      paint: {
        'line-color': ['case',
          ['all', ['==', ['get', 'severity'], 'conflict'], ['get', 'player']], COLORS['conflict-player'],
          ['==', ['get', 'severity'], 'conflict'], COLORS['conflict-ai'],
          ['get', 'player'], COLORS['caution-player'],
          COLORS['caution-ai']],
        'line-width': 2,
        'line-dasharray': [2, 1.5],
      },
    });
    map.addLayer({
      id: 'aircraft', type: 'symbol', source: 'aircraft',
      layout: {
        'icon-image': ['concat', 'ac-', ['get', 'ckey']],
        'icon-rotate': ['get', 'heading'],
        'icon-rotation-alignment': 'map',
        'icon-size': ['get', 'size'],
        'icon-allow-overlap': true,
      },
      paint: {
        'icon-opacity': ['case', ['get', 'dim'], 0.4, 1],
      },
    });

    // Labels live in their own layer: a pill background (9-patch stretched around the
    // text) whose colour tracks conflict severity. Whole label hides on collision;
    // the aircraft icon above always stays visible.
    map.addLayer({
      id: 'aircraft-labels', type: 'symbol', source: 'aircraft',
      layout: {
        'symbol-sort-key': ['get', 'priority'],
        'icon-image': ['get', 'pill'],
        'icon-text-fit': 'both',
        'icon-text-fit-padding': [3, 7, 3, 7],
        'text-field': ['get', 'label'],
        'text-size': 10,
        'text-offset': [0, 1.7],
        'text-anchor': 'top',
        'text-justify': 'center',
        'text-font': ['DIN Pro Regular', 'Arial Unicode MS Regular'],
      },
      paint: {
        'icon-opacity': ['case', ['get', 'dim'], 0.5, 1],
        'text-opacity': ['case', ['get', 'dim'], 0.6, 1],
        // Dark text on the yellow player-caution pill; light everywhere else.
        'text-color': ['case', ['==', ['get', 'sev'], 'caution-player'], '#2b2413', '#e8e8e8'],
      },
    });

    for (const layer of ['aircraft', 'aircraft-labels']) {
      map.on('click', layer, ev => { if (ev.features.length) { showPopup(ev.features[0]); } });
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
    }

    mapLoaded = true;
    document.getElementById('overlay').style.display = 'none';
    if (pendingSnapshot) { applySnapshot(pendingSnapshot); pendingSnapshot = null; }
    requestAnimationFrame(frame);
  });
}

// ---- host messaging ---------------------------------------------------------------------
if (host) {
  host.addEventListener('message', ev => {
    const msg = ev.data;
    if (!msg || !msg.type) { return; }
    if (msg.type === 'init') {
      initMap(msg.token);
    } else if (msg.type === 'snapshot') {
      if (mapLoaded) { applySnapshot(msg); } else { pendingSnapshot = msg; }
    } else if (msg.type === 'trails') {
      trailsOn = !!msg.on;
    } else if (msg.type === 'labels') {
      labelsOn = !!msg.on;
    } else if (msg.type === 'recenter') {
      didInitialCenter = false;
    }
  });
  toHost({ type: 'ready' });
} else {
  document.getElementById('overlay').textContent = 'This page must be hosted inside the launcher.';
}
</script>
</body>
</html>
